<!-- ====== Preloader (home page; shortened on later visits in the same session) ====== -->
<div class="preloader" data-preloader aria-hidden="true">
  <div class="preloader__cols"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i></div>
  <div class="preloader__content">
    <div class="preloader__row">
      <span class="eyebrow">Travaux électriques · Matériel · Éclairage</span>
      <span class="eyebrow">Chargement</span>
    </div>
    <!-- The outlined logo fills with colour as the page loads -->
    <div class="preloader__mark">
      <svg class="preloader__logo-o" viewBox="0 0 265 80"><use href="#logo"/></svg>
      <svg class="preloader__logo-f" viewBox="0 0 265 80" data-preloader-fill><use href="#logo"/></svg>
    </div>
    <div class="preloader__row preloader__row--end">
      <span class="eyebrow">Maroc</span>
      <div class="preloader__count display"><span data-preloader-count>0</span><sup>%</sup></div>
    </div>
  </div>
  <div class="preloader__bar"><i data-preloader-bar></i></div>
</div>
